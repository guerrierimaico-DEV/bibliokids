<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Livros - BiblioKids</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b9d">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="menu-container"></div>

    <div class="container">
        <div class="header-page">
            <h1>📚 Acervo de Livros</h1>
            <button class="btn btn-primary" onclick="prepararNovoLivro()">➕ Novo Livro</button>
        </div>
        
        <!-- Botões de filtro por categoria -->
        <div class="filtros" id="filtrosCategoria">
            <button class="btn btn-primary" onclick="filtrarLivros('', this)">🌟 Todos</button>
            <button class="btn btn-outline" onclick="filtrarLivros('Disney', this)">🏰 Disney</button>
            <button class="btn btn-outline" onclick="filtrarLivros('Dreamworks', this)">🐉 Dreamworks</button>
            <button class="btn btn-outline" onclick="filtrarLivros('Brasileiro', this)">🇧🇷 Brasileiro</button>
            <button class="btn btn-outline" onclick="filtrarLivros('Outro', this)">📖 Outros</button>
        </div>
        
        <!-- Grelha de cartões de livros -->
        <div class="livros-grid" id="livrosGrid">
            <!-- Preenchido via JavaScript -->
        </div>
    </div>

    <!-- Modal para Adicionar ou Editar Livro -->
    <div id="modalLivro" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModal('modalLivro')">&times;</span>
            <h2>📚 <span id="tituloModal">Novo Livro</span></h2>
            <form id="formLivro" onsubmit="salvarLivro(event)">
                <input type="hidden" id="acaoLivro" value="adicionar">
                <input type="hidden" id="id_livro">
                
                <div class="form-group">
                    <label>Título *</label>
                    <input type="text" id="titulo" required placeholder="Ex: O Pequeno Príncipe">
                </div>
                <div class="form-group">
                    <label>Autor</label>
                    <input type="text" id="autor" placeholder="Ex: Antoine de Saint-Exupéry">
                </div>
                <div class="form-group">
                    <label>Editora</label>
                    <input type="text" id="editora" placeholder="Ex: Agir">
                </div>
                <div class="form-group">
                    <label>Categoria</label>
                    <select id="categoria">
                        <option value="Disney">🏰 Disney</option>
                        <option value="Dreamworks">🐉 Dreamworks</option>
                        <option value="Brasileiro">🇧🇷 Brasileiro</option>
                        <option value="Outro">📖 Outro</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Emoji da Capa</label>
                        <input type="text" id="capa_emoji" maxlength="4" value="📖">
                    </div>
                    <div class="form-group">
                        <label>Cor da Capa</label>
                        <input type="color" id="cor_capa" value="#ff6b9d" style="height: 48px; padding: 4px;">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">💾 Salvar Livro</button>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>verificarLogin();</script>
    <script src="js/app.js"></script>
    <script>
        // Limpa e abre o modal para cadastrar um livro novo
        function prepararNovoLivro() {
            document.getElementById('formLivro').reset();
            document.getElementById('id_livro').value = '';
            document.getElementById('acaoLivro').value = 'adicionar';
            document.getElementById('tituloModal').textContent = 'Novo Livro';
            document.getElementById('cor_capa').value = '#ff6b9d';
            document.getElementById('capa_emoji').value = '📖';
            abrirModal('modalLivro');
        }

        // Atualiza o estado visual dos botões de filtro e recarrega a lista
        function filtrarLivros(categoria, botaoClicado) {
            document.querySelectorAll('#filtrosCategoria .btn').forEach(btn => {
                btn.classList.remove('btn-primary');
                btn.classList.add('btn-outline');
            });
            botaoClicado.classList.remove('btn-outline');
            botaoClicado.classList.add('btn-primary');
            carregarLivros(categoria);
        }
    </script>
</body>
</html>
