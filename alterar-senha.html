<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔑 Alterar Senha - BiblioKids</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b9d">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="menu-container"></div>

    <div class="container">
        <div class="header-page">
            <h1>🔑 Alterar Minha Senha</h1>
        </div>
        
        <div class="form-card">
            <form id="formMinhaSenha" onsubmit="alterarMinhaSenha(event)">
                <div class="form-group">
                    <label>🔒 Senha Atual *</label>
                    <input type="password" id="senha_atual" required placeholder="Digite sua senha atual">
                </div>
                <div class="form-group">
                    <label>🆕 Nova Senha (mín. 5 caracteres) *</label>
                    <input type="password" id="nova_senha" required minlength="5" placeholder="Mínimo 5 caracteres">
                </div>
                <div class="form-group">
                    <label>🔁 Confirmar Nova Senha *</label>
                    <input type="password" id="confirmar_senha" required minlength="5" placeholder="Repita a nova senha">
                </div>
                <button type="submit" class="btn btn-primary btn-block">💾 Atualizar Senha</button>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>verificarLogin();</script>
    <script src="js/app.js"></script>
</body>
</html>
