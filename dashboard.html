<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 BiblioKids - Painel Principal</title>
    <!-- Manifesto PWA e cor do tema para dispositivos móveis -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b9d">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Barra de navegação carregada dinamicamente via js/app.js -->
    <div id="menu-container"></div>

    <div class="container">
        <!-- Cabeçalho de boas-vindas -->
        <div class="header-page">
            <div>
                <h1>🏠 Painel Principal</h1>
                <p class="mb-0">Olá, <b id="nomeAdmin">Administrador</b>! Bem-vindo à BiblioKids 🌟</p>
            </div>
        </div>
        
        <!-- Grelha de Cartões Estatísticos (KPIs) -->
        <div class="cards-grid">
            <div class="card card-pink">
                <div class="card-icon">📚</div>
                <div class="card-info">
                    <h3>Total de Livros</h3>
                    <p class="card-number" id="totalLivros">0</p>
                </div>
            </div>
            <div class="card card-green">
                <div class="card-icon">✅</div>
                <div class="card-info">
                    <h3>Disponíveis</h3>
                    <p class="card-number" id="livrosDisponiveis">0</p>
                </div>
            </div>
            <div class="card card-blue">
                <div class="card-icon">🎒</div>
                <div class="card-info">
                    <h3>Empréstimos Ativos</h3>
                    <p class="card-number" id="emprestimosAtivos">0</p>
                </div>
            </div>
            <div class="card card-yellow">
                <div class="card-icon">👧</div>
                <div class="card-info">
                    <h3>Alunos</h3>
                    <p class="card-number" id="totalAlunos">0</p>
                </div>
            </div>
            <div class="card card-purple">
                <div class="card-icon">📅</div>
                <div class="card-info">
                    <h3>Devoluções Hoje</h3>
                    <p class="card-number" id="devolucoesHoje">0</p>
                </div>
            </div>
        </div>
        
        <!-- Secção dos últimos livros cadastrados -->
        <div class="section">
            <h2>📖 Últimos Livros Cadastrados</h2>
            <div class="livros-grid" id="ultimosLivrosGrid">
                <!-- Preenchido automaticamente pelo JavaScript -->
            </div>
        </div>
    </div>

    <!-- Scripts de Autenticação, Lógica da Aplicação e Service Worker -->
    <script src="js/auth.js"></script>
    <script>
        // Protege a página: redireciona para index.html se não estiver logado
        verificarLogin();
        // Regista o Service Worker para suporte PWA/Offline
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('Erro SW:', err));
        }
    </script>
    <script src="js/app.js"></script>
</body>
</html>
