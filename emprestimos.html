<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎒 Empréstimos - BiblioKids</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b9d">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="menu-container"></div>

    <div class="container">
        <div class="header-page">
            <h1>🎒 Empréstimos Ativos</h1>
            <button class="btn btn-primary" onclick="abrirModal('modalEmprestimo')">➕ Novo Empréstimo</button>
        </div>
        
        <!-- Tabela de Empréstimos -->
        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>📚 Livro</th>
                        <th>👧 Aluno</th>
                        <th>📅 Empréstimo</th>
                        <th>📅 Devolução</th>
                        <th>⏰ Status</th>
                        <th>⚙️ Ação</th>
                    </tr>
                </thead>
                <tbody id="tabelaEmprestimos">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Novo Empréstimo -->
    <div id="modalEmprestimo" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModal('modalEmprestimo')">&times;</span>
            <h2>🎒 Novo Empréstimo</h2>
            <form onsubmit="realizarEmprestimo(event)">
                <div class="form-group">
                    <label>📚 Selecione o Livro Disponível *</label>
                    <select id="selectLivrosDisp" required>
                        <option value="">-- Escolha um livro --</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>👧 Selecione o Aluno *</label>
                    <select id="selectAlunosDisp" required>
                        <option value="">-- Escolha um aluno --</option>
                    </select>
                </div>
                
                <div class="alert alert-info">
                    📅 A data de devolução será calculada automaticamente para <b>7 dias</b> a partir de hoje.
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">✅ Confirmar Empréstimo</button>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>verificarLogin();</script>
    <script src="js/app.js"></script>
</body>
</html>
