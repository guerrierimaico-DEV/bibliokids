<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👧 Alunos - BiblioKids</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b9d">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="menu-container"></div>

    <div class="container">
        <div class="header-page">
            <h1>👧 Alunos / Leitores</h1>
            <button class="btn btn-primary" onclick="prepararNovoAluno()">➕ Novo Aluno</button>
        </div>
        
        <!-- Tabela responsiva de alunos -->
        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>👤 Nome</th>
                        <th>🎫 Matrícula</th>
                        <th>🏫 Turma</th>
                        <th>👨‍👩‍👧 Responsável</th>
                        <th>⚙️ Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaAlunos">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Adicionar/Editar Aluno -->
    <div id="modalAluno" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModal('modalAluno')">&times;</span>
            <h2>👧 <span id="tituloModalAluno">Novo Aluno</span></h2>
            <form id="formAluno" onsubmit="salvarAluno(event)">
                <input type="hidden" id="acaoAluno" value="adicionar">
                <input type="hidden" id="id_aluno">
                
                <div class="form-group">
                    <label>Nome Completo *</label>
                    <input type="text" id="nome_aluno" required placeholder="Ex: Maria Clara Silva">
                </div>
                <div class="form-group">
                    <label>Matrícula *</label>
                    <input type="text" id="matricula" required placeholder="Ex: 2026003">
                </div>
                <div class="form-group">
                    <label>Turma</label>
                    <input type="text" id="turma" placeholder="Ex: 2º Ano A">
                </div>
                <div class="form-group">
                    <label>Responsável</label>
                    <input type="text" id="responsavel" placeholder="Nome do pai, mãe ou tutor">
                </div>
                <button type="submit" class="btn btn-primary btn-block">💾 Salvar Aluno</button>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>verificarLogin();</script>
    <script src="js/app.js"></script>
    <script>
        // Prepara o formulário limpo para cadastro de novo aluno
        function prepararNovoAluno() {
            document.getElementById('formAluno').reset();
            document.getElementById('id_aluno').value = '';
            document.getElementById('acaoAluno').value = 'adicionar';
            document.getElementById('tituloModalAluno').textContent = 'Novo Aluno';
            document.getElementById('matricula').readOnly = false;
            abrirModal('modalAluno');
        }
    </script>
</body>
</html>
