<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 BiblioKids - Criar Administrador Inicial</title>
    <!-- Manifesto PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b9d">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Folha de estilos personalizada -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-bg">
<div class="login-container">
    <div class="login-card">
        <div class="login-logo">✨</div>
        <h1>Bem-vindo!</h1>
        <p class="subtitle">Crie o seu utilizador local para começar 📚</p>
        
        <div id="erroRegistro" class="alert alert-danger" style="display: none;"></div>
        
        <form onsubmit="registarPrimeiroAdmin(event)">
            <div class="form-group">
                <label>👤 Nome Completo</label>
                <input type="text" id="nomeReg" required autocomplete="off" placeholder="Ex: Professor(a) Responsável">
            </div>
            <div class="form-group">
                <label>🏷️ Nome de Utilizador (Login)</label>
                <input type="text" id="usuarioReg" required autocomplete="off" placeholder="Ex: admin">
            </div>
            <div class="form-group">
                <label>🔒 Palavra-passe (Mín. 5 caracteres)</label>
                <input type="password" id="senhaReg" required minlength="5" placeholder="Crie uma senha segura">
            </div>
            <button type="submit" class="btn btn-primary btn-block">🚀 Criar Conta e Entrar</button>
        </form>
        
        <div class="login-footer">
            <p>🎨 Tudo gravado localmente no seu navegador!</p>
        </div>
    </div>
</div>

<script src="js/auth.js"></script>
<script>
    // Garante que se já existir administrador criado, redireciona de volta para o login
    verificarPrimeiroAcesso();

    function registarPrimeiroAdmin(e) {
        e.preventDefault();
        const nome = document.getElementById('nomeReg').value.trim();
        const usuario = document.getElementById('usuarioReg').value.trim();
        const senha = document.getElementById('senhaReg').value;

        let admins = JSON.parse(localStorage.getItem('bibliokids_admins')) || [];
        
        if (admins.length > 0) {
            window.location.href = 'index.html';
            return;
        }

        // Cria o primeiro utilizador como Master local gravado no LocalStorage
        const novoAdmin = {
            id: 1,
            nome: nome,
            usuario: usuario,
            senha: senha,
            master: true,
            criadoEm: new Date().toISOString()
        };

        admins.push(novoAdmin);
        localStorage.setItem('bibliokids_admins', JSON.stringify(admins));

        // Faz login automático na sessão após criar
        sessionStorage.setItem('admin_logado', 'true');
        sessionStorage.setItem('admin_id', novoAdmin.id);
        sessionStorage.setItem('admin_nome', novoAdmin.nome);
        sessionStorage.setItem('admin_master', 'true');

        // Redireciona para o painel principal
        window.location.href = 'dashboard.html';
    }
</script>
</body>
</html>
