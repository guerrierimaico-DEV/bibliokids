<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👨‍💼 Administradores - BiblioKids</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b9d">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="menu-container"></div>

    <div class="container">
        <div class="header-page">
            <h1>👨‍💼 Administradores</h1>
            <button class="btn btn-primary" onclick="abrirModal('modalAdmin')">➕ Novo Administrador</button>
        </div>
        
        <div class="alert alert-info">
            🔒 <b>Controle de Acesso:</b> Apenas administradores com perfil <b>Master</b> podem criar ou remover outros operadores.
        </div>
        
        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>👤 Nome</th>
                        <th>🎫 Tipo</th>
                        <th>📅 Criado em</th>
                        <th>⚙️ Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaAdmins">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Criar Administrador -->
    <div id="modalAdmin" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModal('modalAdmin')">&times;</span>
            <h2>👨‍💼 Novo Administrador</h2>
            <form id="formAdmin" onsubmit="criarAdmin(event)">
                <div class="form-group">
                    <label>Nome Completo *</label>
                    <input type="text" id="nomeAdminNovo" required placeholder="Ex: Prof.ª Helena">
                </div>
                <div class="form-group">
                    <label>Usuário (login) *</label>
                    <input type="text" id="usuarioAdminNovo" required autocomplete="off" placeholder="Ex: helena">
                </div>
                <div class="form-group">
                    <label>Senha (mín. 5 caracteres) *</label>
                    <input type="password" id="senhaAdminNovo" required minlength="5" placeholder="******">
                </div>
                <button type="submit" class="btn btn-primary btn-block">💾 Criar Administrador</button>
            </form>
        </div>
    </div>

    <!-- Modal Alterar Senha de Terceiros -->
    <div id="modalSenhaAdmin" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModal('modalSenhaAdmin')">&times;</span>
            <h2>🔑 Alterar Senha</h2>
            <p>Administrador: <b id="nomeAdminSenha"></b></p>
            <form id="formSenhaAdmin" onsubmit="alterarSenhaAdminPorMaster(event)">
                <input type="hidden" id="id_admin_senha">
                <div class="form-group">
                    <label>Nova Senha (mín. 5 caracteres) *</label>
                    <input type="password" id="nova_senha_master" required minlength="5">
                </div>
                <button type="submit" class="btn btn-primary btn-block">💾 Salvar Nova Senha</button>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        verificarLogin();
        // Restringe o acesso apenas a administradores Master
        if (sessionStorage.getItem('admin_master') !== 'true') {
            window.location.href = 'dashboard.html';
        }
    </script>
    <script src="js/app.js"></script>
</body>
</html>
